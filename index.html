<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Roads to the Legion of Honor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <span class="mark">Five Roads</span>
    <nav class="tabs" aria-label="View">
      <button id="tab-overview" aria-pressed="true">Overview</button>
      <button id="tab-period" aria-pressed="false">By period</button>
      <button id="tab-work" aria-pressed="false">Follow one work</button>
      <button id="tab-quiz" aria-pressed="false">Quiz</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="title">
    <div>
      <h1>Five Roads to the Legion of Honor</h1>
      <p>Intro text coming soon.</p>
    </div>
  </section>

  <section class="main">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the routes of the five works"></svg>
      <div class="map-buttons">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button id="zoom-reset" aria-label="Show the whole map">&#8634;</button>
      </div>
      <div class="map-key" aria-label="Map key">
        <div class="key-title">Map key</div>
        <div><svg viewBox="0 0 34 10"><line x1="2" y1="5" x2="32" y2="5" stroke="#101519" stroke-width="3.5" stroke-linecap="round"/></svg>Documented</div>
        <div><svg viewBox="0 0 34 10"><line x1="2" y1="5" x2="32" y2="5" stroke="#101519" stroke-width="3" stroke-dasharray="7 5"/></svg>Inferred or uncertain</div>
        <div><svg viewBox="0 0 34 10"><line x1="2" y1="5" x2="32" y2="5" stroke="#101519" stroke-width="1.5" opacity=".3"/></svg>Other steps or works</div>
        <div><svg viewBox="0 0 34 18"><circle cx="17" cy="9" r="7" fill="none" stroke="#101519" stroke-width="1.5"/><circle cx="17" cy="9" r="2" fill="#101519"/></svg>Rudier foundry, Paris</div>
        <div class="key-works"></div>
        <div class="key-note">Arcs are drawn, not real routes. Drag to move, scroll to zoom.</div>
      </div>
    </div>
    <aside class="panel" id="panel">
      <p>Panel content will go here.</p>
    </aside>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
